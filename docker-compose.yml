services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    image: ghcr.io/gefeimu/blog:latest
    build: ./backend
    container_name: blog-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      BLOG_JWT_SECRET: ${BLOG_JWT_SECRET}
      BLOG_ADMIN_PASSWORD: ${BLOG_ADMIN_PASSWORD}
    volumes:
      - ./markdown:/app/markdown
      - ./uploads:/app/uploads
    ports:
      - "8080:8080"

  waline:
    image: lizheming/waline:latest
    container_name: blog-waline
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SQLITE_PATH: /app/data
      JWT_TOKEN: ${WALINE_JWT_TOKEN}
      SITE_NAME: ${WALINE_SITE_NAME}
      SITE_URL: ${WALINE_SITE_URL}
      MODERATION: 'true'
      AUTHOR_EMAIL: ${WALINE_AUTHOR_EMAIL}
    volumes:
      - waline_data:/app/data

  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - waline
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/uploads:ro
    ports:
      - "80:80"

volumes:
  mysql_data:
  waline_data:
