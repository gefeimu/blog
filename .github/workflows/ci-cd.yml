# CI/CD 流水线：后端测试 → 构建镜像推 ghcr.io → 自托管 Runner 部署
#
# 触发条件：
# - push main 且改动涉及 backend/**、nginx/**、docker-compose.yml、本文件
# - 前端源码改动由 build-frontend.yml 负责构建产物回提交到 nginx/html，
#   产物提交（[skip ci]）再触发本流水线部署，两者不冲突
# - 手动触发：仓库 Actions 页 → CI/CD → Run workflow
#
# 部署方式：
#   deploy job 运行在自托管 Runner 上（部署机本机执行，无需 SSH 密钥、
#   无需公网 IP）。Runner 安装注册见 README「CI/CD 部署」一节。
#   backend-test / docker-image 仍在 GitHub 云端运行。

name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'nginx/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd
  cancel-in-progress: true

jobs:
  # ---------- CI：后端编译 + 测试 ----------
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: cd backend && mvn -B package

  # ---------- CD：构建镜像 + 推送 ghcr.io ----------
  docker-image:
    name: Build & push image
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- CD：自托管 Runner 本机部署 ----------
  deploy:
    name: Deploy to server
    needs: docker-image
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Pull & restart
        run: |
          set -e
          DEPLOY_DIR="$HOME/blog"
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
          fi
          cd "$DEPLOY_DIR"
          if [ ! -f .env ]; then
            echo "缺少 $DEPLOY_DIR/.env，请参照 .env.example 手动创建后重跑部署"
            exit 1
          fi
          git pull --ff-only
          docker compose pull backend
          docker compose up -d --no-build
          docker restart blog-nginx
          docker image prune -f
