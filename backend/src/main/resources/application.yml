server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.blog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 博客业务配置
blog:
  storage:
    # Markdown 文件存储目录（容器内路径，通过 docker-compose 挂载到宿主机 ./markdown）
    markdown-dir: /app/markdown
    # 图片上传目录（容器内路径，通过 docker-compose 挂载到宿主机 ./uploads，Nginx 同目录只读挂载对外提供访问）
    upload-dir: /app/uploads
    # 图片 URL 前缀（与 Nginx location /uploads/ 对应）
    url-prefix: /uploads
